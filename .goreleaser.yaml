version: 2

before:
  hooks:
    - go mod tidy

env:
  - CC_darwin_amd64=o64-clang
  - CC_darwin_arm64=oa64-clang
  - CC_linux_amd64=x86_64-linux-gnu-gcc
  - CC_linux_arm64=aarch64-linux-gnu-gcc
  - CC_linux_386=i686-linux-gnu-gcc
  - CC_windows_amd64=x86_64-w64-mingw32-gcc
  - CC_windows_arm64=/llvm-mingw/bin/aarch64-w64-mingw32-gcc
  - CC_windows_386=i686-w64-mingw32-gcc

builds:
  - env:
      - CGO_ENABLED=1
      - CC={{ index .Env (print "CC_" .Os "_" .Arch) }}
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -X main.Version={{ .Version }}

archives:
  - formats: binary
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Preformance Improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - typos
