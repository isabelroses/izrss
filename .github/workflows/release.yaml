name: releaser

permissions:
  contents: write

on:
  push:
    tags:
      - "*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run GoReleaser
        run: >-
          docker run --rm
          -e GITHUB_TOKEN
          -v "$PWD:/src" -w /src
          ghcr.io/goreleaser/goreleaser-cross:v1.27.3-1@sha256:9411fb6786717c7518f42608129fbf11fb1145d4bab3e206a61857d69a77e3fb
          release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
