# all examples in this file differ from the default settings
# to show how this file may be changed for a better user experience

# this should follow the Go reference time format
# see <https://go.dev/src/time/format.go> for more information
dateformat = "2006/01/02"

# a list of urls to fetch rss feeds from
urls = ["https://isabelroses.com/feed.xml", "https://uncenter.dev/feed.xml"]

# there are settings that only apply to the reader view
[reader]
# this value should be a float between 0 and 1, this tracks how much
# of the screen should be scrolled when the article is marked as read
read_threshold = 0.75

# this value can be "most", "recommended" or "full" and controls the
# width of the article should be displayed to the users screen
# this value can also be an int, however this is not recommended as
# it will not be responsive to screen sizes
size = "full"

# colours used when reading a post, in any format lipgloss supports
# these default to the [colors] palette below when left out
heading = "#B2C98F"
link = "#B2C98F"
code = "#6E8585"
quote = "#6E8585"

# the chroma style used to highlight code blocks
# see <https://xyproto.github.io/splash/docs/> for the available styles
code_theme = "gruvbox"

# draw images inline; this can be "auto", "on" or "off"
# "auto" draws them in terminals known to support it (ghostty and kitty)
images = "auto"

# the tallest an image may be, in terminal rows
# by default images may be as tall as the reader
image_max_height = 16

# these values can be any format that lipgloss supports
# see <https://github.com/charmbracelet/lipgloss#colors>
[colors]
text = "#D6CBB4"
inverttext = "#252B2E"
subtext = "#6E8585"
accent = "#B2C98F"
borders = "#46545B"
